#!/usr/bin/env sh
# Start i3bar to display a workspace bar (plus the system information i3status
# finds out, if available)
# Bar appearance

bar {
    workspace_command /home/l-zeuch/.config/i3/scripts/workspaces.py DisplayPort-0
    font pango:monospace, "Material Icons" 9
    status_command i3status-rs $HOME/.config/i3status-rust/config.toml
    mode dock
    position top
    output DisplayPort-0
    tray_output primary
    colors {
        separator #969896
        background #1d1f21
        statusline #c5c8c6
        focused_workspace #3B4252 #3B4252 #D8DEE9
        active_workspace #373b41 #373b41 #ffffff
        inactive_workspace #282a2e #282a2e #969896
        urgent_workspace #BF616A #BF616A #ffffff
    }
}

